# GitLab CI — dissid.ai (Next.js static export → Firebase Hosting, consultancy target)
# Replaces GitHub Actions. Test on every branch/MR; deploy to Firebase only on main.
# Build with bun (matches bun.lockb); deploy with node + firebase-tools on the artifact.

stages:
  - test
  - deploy

test:
  stage: test
  image: oven/bun:1
  script:
    - bun install --frozen-lockfile
    - bun run test:run
    - bun run build
  artifacts:
    paths:
      - out/
    expire_in: 1 hour

deploy:
  stage: deploy
  image: node:20-slim
  needs:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npm install -g firebase-tools
    - firebase deploy --only hosting:consultancy --project dis-sid --token "$FIREBASE_TOKEN"
